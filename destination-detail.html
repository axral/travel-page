    function DestinationDetail() {
      // Extract destination from URL hash or query string
      const [destKey, setDestKey] = React.useState(null);

      React.useEffect(() => {
        function getDestinationFromURL() {
          // Try query string ?destination=delhi or hash #delhi
          const params = new URLSearchParams(window.location.search);
          if (params.has("destination")) {
            return params.get("destination").toLowerCase();
          }
          if (window.location.hash) {
            return window.location.hash.substring(1).toLowerCase();
          }
          return null;
        }
        setDestKey(getDestinationFromURL());
      }, []);

      if (!destKey) {
        return <p>Please select a destination from the <a href="destination.html">Destinations page</a>.</p>;
      }

      const dest = destinations[destKey];
      if (!dest) {
        return <p>Sorry, details for "{destKey}" are not available. Please check the <a href="destination.html">Destinations page</a>.</p>;
      }

      return (
        <>
          <h2 style={{ textAlign: "center" }}>{destKey.charAt(0).toUpperCase() + destKey.slice(1)}</h2>
          <img src={dest.img} alt={dest.alt} style={{ maxWidth: "100%", borderRadius: "10px", marginBottom: "20px" }} />
          <section>
            <h3>Overview</h3>
            <p>{dest.overview}</p>
          </section>
          <section>
            <h3>Main Attractions</h3>
            <p>{dest.attractions}</p>
          </section>
          <section>
            <h3>Travel Tips</h3>
            <p>{dest.tips}</p>
          </section>
          <section>
            <h3>Packing Suggestions</h3>
            <p>{dest.packing}</p>
          </section>
          <section>
            <h3>Food & Culture</h3>
            <p>{dest.foodCulture}</p>
          </section>
          <section>
            <h3>Suggested Itinerary</h3>
            <p>{dest.itinerary}</p>
          </section>
          <section>
            <h3>Useful Links</h3>
            <ul>
              {dest.links.map((link, index) => (
                <li key={index}>
                  <a href={link.url} target="_blank" rel="noopener noreferrer">{link.text}</a>
                </li>
              ))}
            </ul>
          </section>
          <button
            onClick={() => window.history.back()}
            style={{
              marginTop: "30px",
              padding: "10px 20px",
              fontSize: "16px",
              cursor: "pointer",
              borderRadius: "5px",
              backgroundColor: "#464da7",
              color: "white",
              border: "none"
            }}
          >
            Go Back
          </button>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("detail-root")).render(<DestinationDetail />);
  </script>
