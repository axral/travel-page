<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dream Travel - Explore the World</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Hero section with background and overlay */
    #hero {
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80');
      background-size: cover;
      background-position: center;
      color: white;
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin: 40px auto;
      max-width: 900px;
      overflow: hidden;
      z-index: 0;
    }

    #hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    #hero h2 {
      font-size: 3rem;
      margin-bottom: 15px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    #hero p {
      font-size: 1.3rem;
      margin-bottom: 30px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    #hero .explore-btn {
      background-color: #ff6b6b;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255,107,107,0.6);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    #hero .explore-btn:hover {
      background-color: #e55a5a;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <header>
    <h1><strong>DREAM TRAVEL PAGE</strong></h1>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="faq.html">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero" role="banner" aria-label="Welcome hero section">
      <h2>Welcome to Dream Travel</h2>
      <p>Your journey to unforgettable adventures starts here.</p>
      <a href="destinations.html" class="explore-btn">Explore Destinations</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Dream Travel</p>
    <div id="social-media">
      <a href="https://www.facebook.com" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" />
      </a>
      <a href="https://www.instagram.com" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram" />
      </a>
      <a href="https://x.com" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968958.png" alt="X (Twitter)" />
      </a>
    </div>
  </footer>
</body>
</html>
